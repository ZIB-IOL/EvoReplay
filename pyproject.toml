[project]
name = "evo_replay"
version = "0.1.0"
description = "Post-run analysis suite for evolutionary code-search traces."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy==2.2.6",
    "matplotlib==3.10.8",
    "scipy==1.17.1",
    "scikit-optimize==0.10.2",
    "pyyaml==6.0.3",
    "openai==2.31.0",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
# breakthrough_replay/ also needs skydiscover; install it separately from
# its checkout (e.g. `uv pip install -e /path/to/skydiscover`) — we don't
# pin a path here so this package stays portable.
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/evo_replay"]
